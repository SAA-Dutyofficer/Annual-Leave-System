<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Annual Leave System</title>
  <link rel="stylesheet" href="css/main.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body class="auth-body">

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-icon">✈️</div>
        <h1>Annual Leave System</h1>
        <p>Sign in to manage your leave</p>
      </div>

      <!-- Login Form -->
      <div id="loginView">
        <form id="loginForm" class="auth-form">
          <div class="field-group">
            <label>Email Address</label>
            <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email" required/>
          </div>
          <div class="field-group">
            <label>Password</label>
            <div class="input-wrap">
              <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required/>
              <button type="button" class="toggle-pw" id="togglePw">👁</button>
            </div>
          </div>
          <div class="auth-error" id="loginError"></div>
          <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
            <span class="btn-text">Sign In</span>
            <span class="btn-loader" style="display:none">⏳</span>
          </button>
        </form>
        <p class="auth-hint">
          <a href="#" id="forgotLink" class="auth-link">Forgot your password?</a>
        </p>
      </div>

      <!-- Reset Password Form -->
      <div id="resetView" style="display:none">
        <div class="reset-info">Enter your email address and we'll send you a password reset link.</div>
        <form id="resetForm" class="auth-form">
          <div class="field-group">
            <label>Email Address</label>
            <input type="email" id="resetEmail" placeholder="your@email.com" required/>
          </div>
          <div class="auth-error" id="resetError"></div>
          <div class="auth-success" id="resetSuccess"></div>
          <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
        </form>
        <p class="auth-hint">
          <a href="#" id="backToLogin" class="auth-link">← Back to Sign In</a>
        </p>
      </div>

    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
